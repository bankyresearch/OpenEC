[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "openec-ui"
version = "0.1.0"
description = "Web dashboard UI for OpenEC - Ecommerce & Retail Analytics"
authors = ["Banky Research <bankyresearch@users.noreply.github.com>"]
license = "AGPL-3.0"
homepage = "https://github.com/bankyresearch/OpenEC"
repository = "https://github.com/bankyresearch/OpenEC"
keywords = ["ecommerce", "retail", "analytics", "dashboard", "ui"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial",
    "Operating System :: OS Independent",
]
packages = [
    { include = "openec_ui" },
]
include = [
    "openec_ui/static/**/*",
]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
openec = ">=0.1.0"
uvicorn = ">=0.29.0"
typer = ">=0.12.0"
rich = ">=13.0"

[tool.poetry.scripts]
openec-ui = "openec_ui.cli:app"
